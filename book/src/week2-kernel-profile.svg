<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 718" width="480" height="718" role="img" aria-labelledby="title desc">
<title id="title">Context changes the balance of decode work</title>
<desc id="desc">For one decode token, QKVO and MLP projection dimensions stay fixed while attention reads more key/value positions as context grows. Compare absolute times and category shares at each context. This is a mechanism sketch, not measured proportions or a universal crossover length.</desc>
<style>
  svg { color-scheme: light dark; }
  .bg { fill: #f8fafc; } .card { fill: #ffffff; stroke: #64748b; stroke-width: 1.5; }
  .accent { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2; }
  text { fill: #172033; font: 20px system-ui, sans-serif; }
  .title { font-size: 25px; font-weight: 700; } .label { font-size: 22px; font-weight: 650; }
  .small { font-size: 18px; } .arrow { fill: none; stroke: #334155; stroke-width: 2.5; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #101827; } .card { fill: #172338; stroke: #94a3b8; }
    .accent { fill: #12354a; stroke: #7dd3fc; } text { fill: #f1f5f9; }
    .arrow { stroke: #cbd5e1; }
  }
</style>
<rect class="bg" width="480" height="718" rx="16"/>
<text x="24" y="40" class="title"><tspan x="24" dy="0">Where can the next cost move?</tspan></text><text x="24" y="76" class="small"><tspan x="24" dy="0">One decode token; same model.</tspan></text><rect class="card" x="20" y="101" width="440" height="137" rx="12"/><text x="38" y="136" class="label"><tspan x="38" dy="0">QKVO and MLP / SwiGLU</tspan></text><text x="38" y="173" class=""><tspan x="38" dy="0">Projection widths stay fixed.</tspan><tspan x="38" dy="27">Scheduling and input reuse still</tspan><tspan x="38" dy="27">affect their execution time.</tspan></text><path class="arrow" d="M240 249v35m-7-8 7 8 7-8"/><rect class="accent" x="20" y="298" width="440" height="139" rx="12"/><text x="38" y="333" class="label"><tspan x="38" dy="0">Attention reads a longer prefix</tspan></text><text x="38" y="370" class=""><tspan x="38" dy="0">As context S grows, more K/V</tspan><tspan x="38" dy="27">positions contribute to each query.</tspan><tspan x="38" dy="27">The balance of work can change.</tspan></text><path class="arrow" d="M240 448v35m-7-8 7 8 7-8"/><rect class="card" x="20" y="497" width="440" height="137" rx="12"/><text x="38" y="532" class="label"><tspan x="38" dy="0">Measure both at each context</tspan></text><text x="38" y="569" class=""><tspan x="38" dy="0">Compare absolute times and shares.</tspan><tspan x="38" dy="27">A QKVO / attention versus MLP</tspan><tspan x="38" dy="27">crossover is a result to measure.</tspan></text><text x="24" y="671" class="small"><tspan x="24" dy="0">Mechanism sketch — no measured shares</tspan><tspan x="24" dy="25">or universal crossover length.</tspan></text>
</svg>
