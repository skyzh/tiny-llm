<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 667" role="img" aria-labelledby="title description">
  <title id="title">Historical seven-day Week 2 Qwen3-4B kernel-time attribution</title>
  <desc id="description">These eight historical stacked bars followed the former seven-day Week 2 order: cached decode on Day 2, packed W4 on Day 3, fused model kernels on Day 4, the pre-SIMD control immediately before the SIMD prefill rows on Day 5, the optional decode-attention lab on Day 6, and Split-K on Day 7. Each bar normalized synchronized kernel-group time across projections, attention, normalization position and activation kernels, and KV growth. The day labels do not describe the current book sequence.</desc>
  <style>
    :root {
      color-scheme: light dark;
      --background: #ffffff;
      --foreground: #1f2328;
      --muted: #59636e;
      --grid: #d0d7de;
      --projection: #4c78a8;
      --attention: #f58518;
      --pointwise: #54a24b;
      --cache: #e45756;
      --on-color: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #0d1117;
        --foreground: #f0f6fc;
        --muted: #9ba7b4;
        --grid: #30363d;
        --projection: #6b9bd1;
        --attention: #f7a64a;
        --pointwise: #6dbb65;
        --cache: #eb6a67;
        --on-color: #0d1117;
      }
    }
    .background { fill: var(--background); }
    .heading { fill: var(--foreground); font: 600 17px system-ui, sans-serif; }
    .label { fill: var(--foreground); font: 500 14px system-ui, sans-serif; }
    .detail { fill: var(--muted); font: 12px system-ui, sans-serif; }
    .inside { fill: var(--on-color); font: 600 12px system-ui, sans-serif; }
    .axis { stroke: var(--grid); stroke-width: 1; }
    .projection { fill: var(--projection); }
    .attention { fill: var(--attention); }
    .pointwise { fill: var(--pointwise); }
    .cache { fill: var(--cache); }
    .narrow-layout { display: none; }
    .narrow-heading { fill: var(--foreground); font: 700 34px system-ui, sans-serif; }
    .narrow-label { fill: var(--foreground); font: 600 30px system-ui, sans-serif; }
    .narrow-detail { fill: var(--muted); font: 31px system-ui, sans-serif; }
    .narrow-legend { fill: var(--foreground); font: 500 31px system-ui, sans-serif; }
    .narrow-note { fill: var(--muted); font: 31px system-ui, sans-serif; }
    @media (max-width: 700px) {
      .wide-layout { display: none; }
      .narrow-layout { display: inline; }
    }
  </style>

  <rect class="background" width="1040" height="667" />

