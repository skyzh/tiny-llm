  <text class="detail" x="220" y="570">Bar width is normalized within each checkpoint. Totals are synchronized kernel-group replay time, not trace-instrumented throughput.</text>
  <text class="detail" x="220" y="591">Qwen3-4B, Apple M4 Pro 20-core GPU, MLX 0.32.0; median of 12 after 4 warmups.</text>
