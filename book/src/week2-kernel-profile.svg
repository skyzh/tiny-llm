<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 667" role="img" aria-labelledby="title description">
  <title id="title">Week 2 Qwen3-4B kernel-time attribution by checkpoint</title>
  <desc id="description">Eight stacked bars show the normalized share of synchronized kernel-group time spent in projections, attention, normalization position and activation kernels, and KV growth. Projections dominate the cached decode baseline, pointwise kernels become visible after quantized matvec, attention follows the fused model kernels, and projections dominate prefill before and after the cooperative matrix kernel.</desc>
  <style>
    :root {
      color-scheme: light dark;
      --background: #ffffff;
      --foreground: #1f2328;
      --muted: #59636e;
      --grid: #d0d7de;
      --projection: #4c78a8;
      --attention: #f58518;
      --pointwise: #54a24b;
      --cache: #e45756;
      --on-color: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #0d1117;
        --foreground: #f0f6fc;
        --muted: #9ba7b4;
        --grid: #30363d;
        --projection: #6b9bd1;
        --attention: #f7a64a;
        --pointwise: #6dbb65;
        --cache: #eb6a67;
        --on-color: #0d1117;
      }
    }
    .background { fill: var(--background); }
    .heading { fill: var(--foreground); font: 600 17px system-ui, sans-serif; }
    .label { fill: var(--foreground); font: 500 14px system-ui, sans-serif; }
    .detail { fill: var(--muted); font: 12px system-ui, sans-serif; }
    .inside { fill: var(--on-color); font: 600 12px system-ui, sans-serif; }
    .axis { stroke: var(--grid); stroke-width: 1; }
    .projection { fill: var(--projection); }
    .attention { fill: var(--attention); }
    .pointwise { fill: var(--pointwise); }
    .cache { fill: var(--cache); }
  </style>

  <rect class="background" width="1040" height="667" />

  <g aria-label="Legend">
    <rect class="projection" x="220" y="24" width="16" height="16" rx="2" />
    <text class="label" x="244" y="37">Projections</text>
    <rect class="attention" x="360" y="24" width="16" height="16" rx="2" />
    <text class="label" x="384" y="37">Attention</text>
    <rect class="pointwise" x="480" y="24" width="16" height="16" rx="2" />
    <text class="label" x="504" y="37">Norm + position + activation</text>
    <rect class="cache" x="735" y="24" width="16" height="16" rx="2" />
    <text class="label" x="759" y="37">KV growth</text>
  </g>

  <text class="heading" x="0" y="76">Decode at a 128-token context</text>
  <line class="axis" x1="220" y1="84" x2="830" y2="84" />

  <g aria-label="Day 2 cached decode: projections 81.5 percent, attention 2.1 percent, pointwise 15.6 percent, KV growth 0.8 percent">
    <text class="label" x="0" y="119">Day 2 · cached decode</text>
    <rect class="projection" x="220" y="96" width="497.3" height="34" />
    <rect class="attention" x="717.3" y="96" width="12.5" height="34" />
    <rect class="pointwise" x="729.8" y="96" width="95.3" height="34" />
    <rect class="cache" x="825.1" y="96" width="4.9" height="34" />
    <text class="inside" x="230" y="118">projections 81.5%</text>
    <text class="inside" x="738" y="118">15.6%</text>
    <text class="detail" x="846" y="117">41.3 ms attributed</text>
  </g>

  <g aria-label="Day 3 quantized matvec decode: projections 57.9 percent, attention 4.5 percent, pointwise 35.8 percent, KV growth 1.8 percent">
    <text class="label" x="0" y="176">Day 3 · packed matvec</text>
    <rect class="projection" x="220" y="153" width="353.2" height="34" />
    <rect class="attention" x="573.2" y="153" width="27.6" height="34" />
    <rect class="pointwise" x="600.8" y="153" width="218.1" height="34" />
    <rect class="cache" x="818.9" y="153" width="11.1" height="34" />
    <text class="inside" x="230" y="175">projections 57.9%</text>
    <text class="inside" x="611" y="175">pointwise 35.8%</text>
    <text class="detail" x="846" y="174">17.9 ms attributed</text>
  </g>

  <g aria-label="Day 4 fused model kernels: projections 80.5 percent, attention 6.4 percent, pointwise 10.5 percent, KV growth 2.6 percent">
    <text class="label" x="0" y="233">Day 4 · fused model kernels</text>
    <rect class="projection" x="220" y="210" width="491.2" height="34" />
    <rect class="attention" x="711.2" y="210" width="38.8" height="34" />
    <rect class="pointwise" x="750.0" y="210" width="64.2" height="34" />
    <rect class="cache" x="814.2" y="210" width="15.8" height="34" />
    <text class="inside" x="230" y="232">projections 80.5%</text>
    <text class="inside" x="756" y="232">10.5%</text>
    <text class="detail" x="846" y="231">12.9 ms attributed</text>
  </g>

  <g aria-label="Day 5 fused decode attention: projections 81.1 percent, attention 6.2 percent, pointwise 10.3 percent, KV growth 2.4 percent">
    <text class="label" x="0" y="290">Day 5 · fused decode attention</text>
    <rect class="projection" x="220" y="267" width="494.7" height="34" />
    <rect class="attention" x="714.7" y="267" width="37.9" height="34" />
    <rect class="pointwise" x="752.6" y="267" width="62.6" height="34" />
    <rect class="cache" x="815.2" y="267" width="14.8" height="34" />
    <text class="inside" x="230" y="289">projections 81.1%</text>
    <text class="inside" x="758" y="289">10.3%</text>
    <text class="detail" x="846" y="288">12.7 ms attributed</text>
  </g>

  <text class="heading" x="0" y="359">Prefill</text>
  <line class="axis" x1="220" y1="367" x2="830" y2="367" />

  <g aria-label="Day 5 fused decode attention prefill at 128 tokens: projections 99.0 percent, attention 0.5 percent, pointwise 0.5 percent">
    <text class="label" x="0" y="402">Day 5 · 128-token prefill</text>
    <rect class="projection" x="220" y="379" width="603.7" height="34" />
    <rect class="attention" x="823.7" y="379" width="3.1" height="34" />
    <rect class="pointwise" x="826.8" y="379" width="3.2" height="34" />
    <text class="inside" x="230" y="401">projections 99.0%</text>
    <text class="detail" x="846" y="400">1,208.8 ms attributed</text>
  </g>

  <g aria-label="Day 6 prefill at 128 tokens: projections 92.7 percent, attention 3.6 percent, pointwise 3.7 percent">
    <text class="label" x="0" y="459">Day 6 · 128-token prefill</text>
    <rect class="projection" x="220" y="436" width="565.7" height="34" />
    <rect class="attention" x="785.7" y="436" width="21.8" height="34" />
    <rect class="pointwise" x="807.5" y="436" width="22.5" height="34" />
    <text class="inside" x="230" y="458">projections 92.7%</text>
    <text class="detail" x="846" y="457">159.2 ms attributed</text>
  </g>

  <g aria-label="Day 6 prefill at 32 tokens: projections 91.6 percent, attention 3.9 percent, pointwise 4.5 percent">
    <text class="label" x="0" y="516">Day 6 · 32-token prefill</text>
    <rect class="projection" x="220" y="493" width="558.7" height="34" />
    <rect class="attention" x="778.7" y="493" width="23.8" height="34" />
    <rect class="pointwise" x="802.5" y="493" width="27.5" height="34" />
    <text class="inside" x="230" y="515">projections 91.6%</text>
    <text class="detail" x="846" y="514">47.9 ms attributed</text>
  </g>

  <g aria-label="Day 7 prefill at 32 tokens: projections 91.3 percent, attention 4.0 percent, pointwise 4.7 percent">
    <text class="label" x="0" y="573">Day 7 · 32-token prefill</text>
    <rect class="projection" x="220" y="550" width="556.8" height="34" />
    <rect class="attention" x="776.8" y="550" width="24.7" height="34" />
    <rect class="pointwise" x="801.5" y="550" width="28.5" height="34" />
    <text class="inside" x="230" y="572">projections 91.3%</text>
    <text class="detail" x="846" y="571">46.1 ms attributed</text>
  </g>

  <text class="detail" x="220" y="622">Bar width is normalized within each checkpoint. Totals are synchronized kernel-group replay time, not trace-instrumented throughput.</text>
  <text class="detail" x="220" y="643">Qwen3-4B, Apple M4 Pro 20-core GPU, MLX 0.32.0; median of 12 after 4 warmups.</text>
</svg>
