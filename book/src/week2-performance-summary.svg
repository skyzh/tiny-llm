<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 908" width="480" height="908" role="img" aria-labelledby="title desc">
<title id="title">Evidence ladder for a Week 2 optimization</title>
<desc id="desc">First check correct output. Then verify eligible model dispatch. Compare the component against a matched control and repeat the complete request with the same workload. Only then record keep, reject, or inconclusive, with a condition that would reverse the choice. No result is preselected.</desc>
<style>
  svg { color-scheme: light dark; }
  .bg { fill: #f8fafc; } .card { fill: #ffffff; stroke: #64748b; stroke-width: 1.5; }
  .accent { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2; }
  text { fill: #172033; font: 20px system-ui, sans-serif; }
  .title { font-size: 25px; font-weight: 700; } .label { font-size: 22px; font-weight: 650; }
  .small { font-size: 18px; } .arrow { fill: none; stroke: #334155; stroke-width: 2.5; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #101827; } .card { fill: #172338; stroke: #94a3b8; }
    .accent { fill: #12354a; stroke: #7dd3fc; } text { fill: #f1f5f9; }
    .arrow { stroke: #cbd5e1; }
  }
</style>
<rect class="bg" width="480" height="908" rx="16"/>
<text x="24" y="40" class="title"><tspan x="24" dy="0">From a kernel to a decision</tspan></text><text x="24" y="75" class="small"><tspan x="24" dy="0">One workload, one controlled change.</tspan></text><rect class="card" x="20" y="99" width="440" height="112" rx="12"/><text x="38" y="132" class="label"><tspan x="38" dy="0">1  Correct output</tspan></text><text x="38" y="165" class=""><tspan x="38" dy="0">Match the supplied oracle,</tspan><tspan x="38" dy="27">shape, dtype, masks, and tails.</tspan></text><path class="arrow" d="M240 221v22m-7-8 7 8 7-8"/><rect class="card" x="20" y="257" width="440" height="112" rx="12"/><text x="38" y="290" class="label"><tspan x="38" dy="0">2  Eligible model dispatch</tspan></text><text x="38" y="323" class=""><tspan x="38" dy="0">Check the supported-input rule</tspan><tspan x="38" dy="27">and which model route ran.</tspan></text><path class="arrow" d="M240 379v22m-7-8 7 8 7-8"/><rect class="card" x="20" y="415" width="440" height="112" rx="12"/><text x="38" y="448" class="label"><tspan x="38" dy="0">3  Matched component control</tspan></text><text x="38" y="481" class=""><tspan x="38" dy="0">Same input, evaluated output,</tspan><tspan x="38" dy="27">shared versus separate operation.</tspan></text><path class="arrow" d="M240 537v22m-7-8 7 8 7-8"/><rect class="card" x="20" y="573" width="440" height="112" rx="12"/><text x="38" y="606" class="label"><tspan x="38" dy="0">4  Matched complete request</tspan></text><text x="38" y="639" class=""><tspan x="38" dy="0">Same model, token counts, and</tspan><tspan x="38" dy="27">logit mode; inspect both phases.</tspan></text><path class="arrow" d="M240 695v22m-7-8 7 8 7-8"/><rect class="accent" x="20" y="731" width="440" height="121" rx="12"/><text x="38" y="765" class="label"><tspan x="38" dy="0">Keep · Reject · Inconclusive</tspan></text><text x="38" y="801" class=""><tspan x="38" dy="0">State the supported workload</tspan><tspan x="38" dy="27">and what would reverse the choice.</tspan></text><text x="24" y="886" class="small"><tspan x="24" dy="0">No earlier rung proves a later one.</tspan></text>
</svg>
