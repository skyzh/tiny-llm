<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 650" role="img" aria-labelledby="week2-evidence-title week2-evidence-description">
  <title id="week2-evidence-title">Week 2 evidence ladder</title>
  <desc id="week2-evidence-description">A five-step ladder moves from correctness to routing, component comparison, complete-request product comparison, and a bounded decision. A separate unavailable lane warns that missing product rows must not be filled by component evidence.</desc>
  <style>
    :root{color-scheme:light dark;--bg:#fff;--fg:#1f2328;--muted:#59636e;--line:#8c959f;--card:#f6f8fa;--blue:#0969da;--green:#1a7f37;--amber:#9a6700;--red:#cf222e;--white:#fff}
    @media(prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#f0f6fc;--muted:#9ba7b4;--line:#6e7681;--card:#161b22;--blue:#58a6ff;--green:#3fb950;--amber:#d29922;--red:#f85149;--white:#0d1117}}
    .bg{fill:var(--bg)}.card{fill:var(--card);stroke:var(--line);stroke-width:1.5}.title{fill:var(--fg);font-weight:700;font-size:36px;font-family:system-ui,sans-serif}.step{fill:var(--fg);font-weight:700;font-size:29px;font-family:system-ui,sans-serif}.detail{fill:var(--muted);font-size:24px;font-family:system-ui,sans-serif}.num{fill:var(--white);font-weight:700;font-size:27px;font-family:system-ui,sans-serif}.blue{fill:var(--blue)}.green{fill:var(--green)}.amber{fill:var(--amber)}.red{fill:var(--red)}
  </style>
  <rect class="bg" width="1040" height="650"/>
  <text class="title" x="24" y="50">Week 2 evidence ladder</text>
  <text class="detail" x="24" y="88">Prove more before claiming more.</text>

  <g aria-label="Evidence ladder">
    <rect class="card" x="20" y="116" width="314" height="128" rx="12"/>
    <circle class="blue" cx="58" cy="154" r="22"/><text class="num" x="58" y="163" text-anchor="middle">1</text>
    <text class="step" x="94" y="162">Correctness</text><text class="detail" x="42" y="210">values · masks · tails · state</text>

    <rect class="card" x="354" y="116" width="314" height="128" rx="12"/>
    <circle class="blue" cx="392" cy="154" r="22"/><text class="num" x="392" y="163" text-anchor="middle">2</text>
    <text class="step" x="428" y="162">Routing</text><text class="detail" x="376" y="210">dispatch and copy counters</text>

    <rect class="card" x="688" y="116" width="332" height="128" rx="12"/>
    <circle class="green" cx="726" cy="154" r="22"/><text class="num" x="726" y="163" text-anchor="middle">3</text>
    <text class="step" x="762" y="162">Component</text><text class="detail" x="710" y="210">same operator · same shape</text>

    <rect class="card" x="20" y="270" width="482" height="128" rx="12"/>
    <circle class="green" cx="58" cy="308" r="22"/><text class="num" x="58" y="317" text-anchor="middle">4</text>
    <text class="step" x="94" y="316">Product</text><text class="detail" x="42" y="364">matched complete request</text>

    <rect class="card" x="522" y="270" width="498" height="128" rx="12"/>
    <circle class="amber" cx="560" cy="308" r="22"/><text class="num" x="560" y="317" text-anchor="middle">5</text>
    <text class="step" x="596" y="316">Bounded decision</text><text class="detail" x="544" y="364">keep · reject · inconclusive</text>
  </g>

  <g aria-label="Unavailable evidence boundary">
    <rect class="card" x="20" y="432" width="1000" height="166" rx="12"/>
    <circle class="red" cx="62" cy="474" r="24"/><text class="num" x="62" y="483" text-anchor="middle">!</text>
    <text class="step" x="104" y="482">Unavailable product rows stay unavailable.</text>
    <text class="detail" x="42" y="528">2K/512 and 8K/128: no zero, neighbor, contaminated average,</text>
    <text class="detail" x="42" y="566">or component substitution. Stop at the highest proven rung.</text>
  </g>
</svg>
