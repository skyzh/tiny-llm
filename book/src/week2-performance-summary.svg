<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1120" width="480" height="1120" role="img" aria-labelledby="week2-evidence-title week2-evidence-description">
  <title id="week2-evidence-title">Week 2 evidence ladder</title>
  <desc id="week2-evidence-description">A five-step ladder moves from correctness to routing, component comparison, complete-request product comparison, and a bounded decision. A separate unavailable lane warns that missing product rows must not be filled by component evidence.</desc>
  <style>
    :root{color-scheme:light dark;--bg:#fff;--fg:#1f2328;--muted:#59636e;--line:#8c959f;--card:#f6f8fa;--blue:#0969da;--green:#1a7f37;--amber:#9a6700;--red:#cf222e;--white:#fff}
    @media(prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#f0f6fc;--muted:#9ba7b4;--line:#6e7681;--card:#161b22;--blue:#58a6ff;--green:#3fb950;--amber:#d29922;--red:#f85149;--white:#0d1117}}
    .bg{fill:var(--bg)}.card{fill:var(--card);stroke:var(--line);stroke-width:1.5}.title{fill:var(--fg);font-weight:700;font-size:32px;font-family:system-ui,sans-serif}.step{fill:var(--fg);font-weight:700;font-size:27px;font-family:system-ui,sans-serif}.detail{fill:var(--muted);font-size:22px;font-family:system-ui,sans-serif}.num{fill:var(--white);font-weight:700;font-size:25px;font-family:system-ui,sans-serif}.blue{fill:var(--blue)}.green{fill:var(--green)}.amber{fill:var(--amber)}.red{fill:var(--red)}
  </style>
  <rect class="bg" width="480" height="1120"/>
  <text class="title" x="24" y="48">Week 2 evidence ladder</text>
  <text class="detail" x="24" y="84">Prove more before claiming more.</text>

  <g aria-label="Evidence ladder">
    <rect class="card" x="20" y="112" width="440" height="130" rx="12"/>
    <circle class="blue" cx="58" cy="152" r="22"/><text class="num" x="58" y="160" text-anchor="middle">1</text>
    <text class="step" x="94" y="160">Correctness</text>
    <text class="detail" x="42" y="204">values · masks · tails · state</text>

    <rect class="card" x="20" y="258" width="440" height="130" rx="12"/>
    <circle class="blue" cx="58" cy="298" r="22"/><text class="num" x="58" y="306" text-anchor="middle">2</text>
    <text class="step" x="94" y="306">Routing</text>
    <text class="detail" x="42" y="350">dispatch and copy counters</text>

    <rect class="card" x="20" y="404" width="440" height="130" rx="12"/>
    <circle class="green" cx="58" cy="444" r="22"/><text class="num" x="58" y="452" text-anchor="middle">3</text>
    <text class="step" x="94" y="452">Component</text>
    <text class="detail" x="42" y="496">same operator · same shape</text>

    <rect class="card" x="20" y="550" width="440" height="130" rx="12"/>
    <circle class="green" cx="58" cy="590" r="22"/><text class="num" x="58" y="598" text-anchor="middle">4</text>
    <text class="step" x="94" y="598">Product</text>
    <text class="detail" x="42" y="642">matched complete request</text>

    <rect class="card" x="20" y="696" width="440" height="130" rx="12"/>
    <circle class="amber" cx="58" cy="736" r="22"/><text class="num" x="58" y="744" text-anchor="middle">5</text>
    <text class="step" x="94" y="744">Bounded decision</text>
    <text class="detail" x="42" y="788">keep · reject · inconclusive</text>
  </g>

  <g aria-label="Unavailable evidence boundary">
    <rect class="card" x="20" y="842" width="440" height="246" rx="12"/>
    <circle class="red" cx="58" cy="884" r="24"/><text class="num" x="58" y="892" text-anchor="middle">!</text>
    <text class="step" x="96" y="892">Unavailable evidence</text>
    <text class="detail" x="42" y="940">2K/512 and 8K/128 product rows:</text>
    <text class="detail" x="42" y="976">no zero or neighboring value,</text>
    <text class="detail" x="42" y="1012">no contaminated average,</text>
    <text class="detail" x="42" y="1048">no component substitution.</text>
    <text class="detail" x="42" y="1076">Stop at the highest proven rung.</text>
  </g>
</svg>
